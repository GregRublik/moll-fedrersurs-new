# Selection rules for "права требования / дебиторская задолженность".
# The file is hashed into filter_version; changing it requires `refilter`.

[scope]
trade_types = ["PublicOffer"]
include_all_public_offers = true
regions = []
expand_by_bankrupt = false
bankrupt_expansion_limit = 20

[classifiers]
include_names = [
    "права требования",
    "дебиторская задолженность",
    "имущественные права",
    "уступка права требования",
    "цессия",
]
exclude_names = ["кредиторская задолженность"]
match_mode = "contains_normalized"

[text]
include_patterns = [
    'дебиторск\w*\s+задолженност',
    'прав[ао]\s+требовани[ея]?\s+к\s+',
    'уступк\w*\s+прав',
    'цесси',
    'долговы[ех]\s+обязательств',
]
negative_patterns = [
    'кредиторск\w*\s+задолженност',
    'право\s+требования\s+на\s+получение\s+результатов\s+работ',
]
scan_fields = ["trade_object", "sale_agreement", "payment_info", "trade_message", "event_text"]
min_matches = 1

[heuristics]
text_overrides_classifier = true
classifier_overrides_text = true
public_offer_requires_keyword = false
# exclude — всё, что не совпало; review — оставлять несовпавшее на ручной разбор
unmatched_decision = "exclude"

[showcase]
use_account_receivables = true
force_include_matches = true
