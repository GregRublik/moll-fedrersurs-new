# Source: live portal b24test.lot4rent.ru, crm.item.fields with
# useOriginalUfNames=Y (2026-11-15). Names below are ORIGINAL Bitrix names.
# BitrixClient converts UF_CRM_138_X -> ufCrm138_X for API calls unless
# useOriginalUfNames="Y" is passed explicitly.
#
# IMPORTANT: crm.type.id != entityTypeId.
#   1078 -> crm.type.id 138 (hence UF_CRM_138_*)
#   1120 -> crm.type.id 148 (hence UF_CRM_148_*)

